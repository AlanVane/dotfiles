monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "alsa_card.pci-0000_00_1f.3"  # Intel板载声卡（HDA Intel PCH）
      }
    ]
    actions = {
      update-props = {
        api.alsa.use-acp = true        # 启用ALSA卡配置文件
        api.acp.auto-profile = false   # 禁用自动配置集切换
        api.acp.auto-port = false      # 禁用自动端口切换
      }
    }
  }
]
