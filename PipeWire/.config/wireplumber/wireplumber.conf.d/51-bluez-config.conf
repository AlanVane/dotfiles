monitor.bluez.properties = {
  bluez5.enable-msbc = true
  bluez5.enable-sbc-xq = true

  # 启用 LDAC（需耳机端支持；不支持时自动回退到 sbc/sbc_xq）。
  # 注意：WirePlumber 无法用属性强制某设备的初始 profile，
  # 编解码器由 bluez5.codecs 白名单 + 协商决定。
  bluez5.codecs = [ ldac sbc sbc_xq ]

  # LDAC 编码质量：auto(自适应ABR，默认) / hq(990kbps) / sq(660kbps) / mq(330kbps)
  # 高码率在信号不佳时容易断流，默认 auto 会自动调节
  # bluez5.a2dp.ldac.quality = "hq"
}
