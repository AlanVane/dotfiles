workspaces:

  #使用前需要修改 root 为具体的 project dir.
  claudecode-setting:
    name: claudecode-setting
    root: ~/projects/private/dotfiles
    startup_window: Claude-Code
    windows:
      - name: FCC-Server
        cmd: fcc-server
      - name: Claude-Code
        cmd: fcc-claude
      - name: GitU
        cmd: gitu
      - name: HarnessKit_Web_UI
        cmd: ~/.config/tmux-workspace.d/HarnessKit_Web_UI.sh
    # Claude Code & Codex 才有用
      - name: Claude-Code-Agent-Monitor
        cmd: ~/.config/tmux-workspace.d/Claude-Code-Agent-Monitor.sh

  #使用前需要修改 root 为具体的 project dir.
  opencode-setting:
    name: opencode-setting
    root: ~/projects/private/dotfiles
    startup_window: HarnessKit_Web_UI
    windows:
      - name: OpenCode
        cmd: # fcc-opencode
      - name: GitU
        cmd: gitu
      - name: HarnessKit_Web_UI
        cmd: ~/.config/tmux-workspace.d/HarnessKit_Web_UI.sh

  dotfiles:
    root: ~/projects/private/dotfiles
    windows:
      - name: editor
        cmd: nvim .
      - name: GitU
        cmd: gitu

  my-notes:
    root: ~/projects/private/org-notes
    windows:
      - name: editor
        cmd: nvim .
      - name: GitU
        cmd: gitu

  opc-notes:
    root: ~/projects/private/OPC-Notes
    windows:
      - name: editor
        cmd: nvim .
      - name: GitU
        cmd: gitu

  web-nav:
    name: next-web-nav
    root: ~/projects/private/next-web-nav
    startup_window: editor
    windows:
      - name: editor
        cmd: nvim .
      - name: dev
        cmd: pnpm run dev
      - name: GitU
        cmd: gitu

  opencode-demo:
    root: ~/projects/private/dotfiles
    startup_window: OpenCode
    windows:
      - name: FCC-Server
        cmd: fcc-server
      - name: OpenCode
        cmd: fcc-opencode
      - name: GitU
        cmd: gitu
