;=====================================================
;     File Includes
;=====================================================

[section/base]
include-file = ~/.config/polybar/master.ini
include-file = ~/.config/polybar/modules.ini
include-file = ~/.config/polybar/workspaces.ini

;=====================================================
;    Master Bar
;=====================================================

;Top Bar
[bar/top]
monitor = ${env:MONITOR:HDMI-1}
monitor-strict = true
dpi = 96
bottom = false
width = 100%
height = 30
offset-x = 0
offset-y = 0

background = ${colors.trans}
foreground = ${colors.foreground}

overline-size = 0
overline-color = #f00
underline-size = 2
underline-color = #00f

border-bottom-size = 0
border-bottom-color = ${colors.background}

line-color = ${colors.background}
line-size = 16

module-margin = 1

; This module uses IPC
enable-ipc = true

font-0 = fixed:pixelsize=12;2
font-1 = Twemoji:style=Regular:scale=8;2
font-2 = Font Awesome 7 Free:style=Solid:pixelsize=12;2
font-3 = Font Awesome 7 Free:style=Regular:pixelsize=12;2
font-4 = Font Awesome 7 Brands:pixelsize=12;2
font-5 = Symbols Nerd Font Mono:style=Regular:size=12;2
font-6 = JetBrainsMonoNerdFontMono:style=Regular:size=16;2
# font-7 用于 polyplayer显示汉字
font-7 = SourceHanSans:style=Regular:size=12;2

;== Module Location ========================================================

modules-left = system-uptime-pretty sep polyplayer
modules-center = wired-network wireless-network
modules-right = redshift sep bluetooth pipewire-volume pipewire-microphone sep cpu system-cpu-temppercore sep alerts

;===========================================================================

;Bottom Bar
[bar/bottom]
monitor = ${env:MONITOR:HDMI-1}
monitor-strict = true
dpi = 96
bottom = true
width = 100%
height = 30
offset-x = 0
offset-y = 0

background = ${colors.trans}
foreground = ${colors.foreground}

border-bottom-size = 0
border-bottom-color = ${colors.background}

line-color = ${bar/top.background}
line-size = 2

module-margin = 1

font-0 = fixed:pixelsize=12;2
font-1 = Twemoji:style=Regular:scale=8;2
font-2 = Font Awesome 7 Free:style=Solid:size=12;2
font-3 = Font Awesome 7 Free:style=Regular:size=12;2
font-4 = Font Awesome 7 Brands:pixelsize=12;2
font-5 = Symbols Nerd Font Mono:style=Regular:size=12;2
font-6 = JetBrainsMonoNerdFontMono:style=Regular:size=16;2

;== Module Location ========================================================

modules-left = rofi-power-menu rofi-applications sep xkeyboard
modules-center = i3
modules-right = info-trash sep date sep tray-panel

;===========================================================================
