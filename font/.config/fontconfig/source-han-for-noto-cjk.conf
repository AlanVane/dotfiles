<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM 'fonts.dtd'>
<fontconfig>

  <!-- Noto CJK 未安装时把请求收口到思源 (Source Han)。
       按区域保留后缀映射, 避免落到无后缀的默认变体 (日文形态).
       注意: Source Han 的香港变体叫 HC 而非 HK (Noto 叫 HK). -->

  <match target="pattern">
    <test qual="any" name="family">
      <string>Noto Sans CJK SC</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>Source Han Sans SC</string>
    </edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family">
      <string>Noto Sans CJK TC</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>Source Han Sans TC</string>
    </edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family">
      <string>Noto Sans CJK HK</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>Source Han Sans HC</string>
    </edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family">
      <string>Noto Sans CJK JP</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>Source Han Sans</string>
    </edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family">
      <string>Noto Sans CJK KR</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>Source Han Sans K</string>
    </edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family">
      <string>Noto Serif CJK SC</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>Source Han Serif SC</string>
    </edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family">
      <string>Noto Serif CJK TC</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>Source Han Serif TC</string>
    </edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family">
      <string>Noto Serif CJK HK</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>Source Han Serif HC</string>
    </edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family">
      <string>Noto Serif CJK JP</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>Source Han Serif</string>
    </edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family">
      <string>Noto Serif CJK KR</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>Source Han Serif K</string>
    </edit>
  </match>

</fontconfig>
