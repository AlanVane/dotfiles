<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>

  <!-- Font directory list -->
  <dir>/usr/share/fonts</dir>
  <dir prefix="xdg">fonts</dir>

  <!-- Load local system customization file -->
  <include ignore_missing="yes">conf.d</include>

  <!-- rendering options -->
  <match target="font">

    <!-- 自动微调, 默认关闭. 因为我们在使用 FreeType2，现在基本不需要使用它 -->
    <edit name="autohint" mode="assign">
      <bool>false</bool>
    </edit>

    <!-- 字体微调, 默认启用. 它的预期效果是使字体看起来更清晰，从而使它们更容易阅读. -->
    <edit name="hinting" mode="assign">
      <bool>true</bool>
    </edit>

    <!-- 字体微调的程度, 可选为 hintnone, hintslight (默认), hintmedium, hintfull. -->
    <!-- 简单来说，更高的 hinting 等级可以使字体更锐利，但同时也会损失更多的细节. -->
    <!-- 如果你的显示器的 DPI 高得不像话 (>=300), 那么就可以关闭 hinting, 因为字体会自然对齐像素. -->
    <edit name="hintstyle" mode="assign">
      <const>hintslight</const>
    </edit>

    <!-- 抗锯齿. 除非你的屏幕DPI奇高否则建议开启. -->
    <edit name="antialias" mode="assign">
      <bool>true</bool>
    </edit>

    <!-- 关于lcdfilter, 因为我们在使用 FreeType2 自带的 Harmony 子像素渲染, 应该是不需要设置的. -->
    <edit name="lcdfilter" mode="assign">
      <const>lcddefault</const>
    </edit>

    <!-- 显示器使用的像素排列方式. 现代显示器基本都是用rgb排列. -->
    <edit name="rgba" mode="assign">
      <const>rgb</const>
    </edit>

  </match>

  <!-- no embeddedbitmap except for Twemoji -->
  <match target="font">
    <test name="family" compare="not_eq">
      <string>Twemoji</string>
    </test>

    <!-- 关闭内嵌点阵字体 -->
    <edit name="embeddedbitmap" mode="assign">
      <bool>false</bool>
    </edit>
  </match>

  <!-- no antialias for Twemoji
    or in italic in gvim it shows blank
    qual="all", or firefox uses web font non-aliased for https://status.python.org/
    specific to gvim, or Google Chrome uses web font non-aliased, e.g. home page, github.
  -->
  <match target="font">
    <test name="prgname" compare="eq">
      <string>gvim</string>
    </test>
    <test name="family" compare="eq">
      <string>Twemoji</string>
    </test>
    <edit mode="assign" name="antialias">
      <bool>false</bool>
    </edit>
  </match>

  <!-- includes -->
  <include prefix="xdg">fontconfig/web-ui-fonts.conf</include>
  <include prefix="xdg">fontconfig/web.conf</include>
  <include prefix="xdg">fontconfig/source-han-for-noto-cjk.conf</include>
  <include prefix="xdg">fontconfig/win-replacements.conf</include>

  <!-- Replace monospace fonts -->
  <match target="pattern">
    <test name="family" compare="contains">
      <string>Source Code</string>
    </test>
    <edit name="family" binding="strong">
      <string>monospace</string>
    </edit>
  </match>

  <!-- Replace emoji fonts -->
  <match target="pattern">
    <test name="family" compare="eq">
      <string>Noto Color Emoji</string>
    </test>
    <edit name="family" binding="strong">
      <string>Twemoji</string>
    </edit>
  </match>

  <!-- 将 Liberation 系列对应到我们定义的优先字体上 -->
  <!-- Map fonts that are commonly used by web pages to our preferred fonts -->
  <match target="pattern">
    <test qual="any" name="family"><string>Liberation Sans</string></test>
    <edit name="family" mode="prepend" binding="same"><string>sans-serif</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Liberation Mono</string></test>
    <edit name="family" mode="prepend" binding="same"><string>monospace</string></edit>
  </match>

  <!-- 英文默认字体使用 DejaVu 和 思源黑体、思源宋体 ,终端使用 DejaVu Sans Mono. -->

  <!-- Default system-ui fonts -->
  <match target="pattern">
    <test name="family">
      <string>system-ui</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>sans-serif</string>
    </edit>
  </match>

  <!-- Default sans-serif fonts-->
  <match target="pattern">
    <test qual="any" name="family">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>DejaVu Sans</string>
      <string>思源黑体</string>
      <string>Twemoji</string>
      <string>Font Awesome 7 Free</string>
      <string>Font Awesome 7 Brands</string>
    </edit>
  </match>

  <!-- Default serif fonts-->
  <match target="pattern">
    <test qual="any" name="family">
      <string>serif</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>DejaVu Serif</string>
      <string>思源宋体</string>
      <string>Twemoji</string>
      <string>Font Awesome 7 Free</string>
      <string>Font Awesome 7 Brands</string>
    </edit>
  </match>

  <!-- Default monospace fonts-->
  <match target="pattern">
    <test qual="any" name="family">
      <string>monospace</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>DejaVu Sans Mono</string>
      <!-- Noto Sans Symbols has weird height for 🅥 -->
      <!-- use SC name to default to zh_CN when locale is e.g. en -->
      <string>思源黑体</string>
      <!-- Font Awesome has monocolor ⛩ but let's use Twemoji's colorful one -->
      <string>Twemoji</string>
      <string>Font Awesome 7 Free</string>
      <string>Font Awesome 7 Brands</string>
    </edit>
  </match>

  <!-- 全局默认中文字体 -->
  <!-- 中文默认字体使用 思源黑体 和 思源宋体，不使用　Noto Sans CJK SC 是因为这个字体会在特定情况下显示片假字. -->

  <!-- default fonts for Chinese (Hong Kong) -->
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>zh-</string>
    </test>
    <test name="lang" compare="contains">
      <string>-HK</string>
    </test>
    <test name="family">
      <string>monospace</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>DejaVu Sans Mono</string>
      <string>Source Han Sans HC</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>zh-</string>
    </test>
    <test name="lang" compare="contains">
      <string>-HK</string>
    </test>
    <test name="family">
      <string>serif</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>DejaVu Serif</string>
      <string>Source Han Serif HC</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>zh-</string>
    </test>
    <test name="lang" compare="contains">
      <string>-HK</string>
    </test>
    <test name="family">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>DejaVu Sans</string>
      <string>Source Han Sans HC</string>
    </edit>
  </match>

  <!-- default fonts for Chinese (Taiwan) -->
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>zh-</string>
    </test>
    <test name="lang" compare="contains">
      <string>-TW</string>
    </test>
    <test name="family">
      <string>monospace</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>DejaVu Sans Mono</string>
      <string>Source Han Sans TC</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>zh-</string>
    </test>
    <test name="lang" compare="contains">
      <string>-TW</string>
    </test>
    <test name="family">
      <string>serif</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>DejaVu Serif</string>
      <string>Source Han Serif TC</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>zh-</string>
    </test>
    <test name="lang" compare="contains">
      <string>-TW</string>
    </test>
    <test name="family">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>DejaVu Sans</string>
      <string>Source Han Sans TC</string>
    </edit>
  </match>

  <!-- default fonts for Japanese -->
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>ja</string>
    </test>
    <test name="family">
      <string>monospace</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>DejaVu Sans Mono</string>
      <string>Source Han Sans</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>ja</string>
    </test>
    <test name="family">
      <string>serif</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>DejaVu Serif</string>
      <string>Source Han Serif</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>ja</string>
    </test>
    <test name="family">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>DejaVu Sans</string>
      <string>Source Han Sans</string>
    </edit>
  </match>

  <!-- default fonts for Korean -->
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>ko</string>
    </test>
    <test name="family">
      <string>monospace</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>DejaVu Sans Mono</string>
      <string>Source Han Sans K</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>ko</string>
    </test>
    <test name="family">
      <string>serif</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>DejaVu Serif</string>
      <string>Source Han Serif K</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>ko</string>
    </test>
    <test name="family">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>DejaVu Sans</string>
      <string>Source Han Sans K</string>
    </edit>
  </match>

  <!-- 不会在任何程序中使用 Nimbus Sans 这个字体 -->
  <selectfont>
    <rejectfont>
      <pattern>
        <patelt name="family" >
          <!-- This font is causing problem with GitHub -->
          <string>Nimbus Sans</string>
        </patelt>
      </pattern>
    </rejectfont>
  </selectfont>

  <!-- Font cache directory list -->

  <cachedir>/var/cache/fontconfig</cachedir>
  <cachedir prefix="xdg">fontconfig</cachedir>

</fontconfig>
